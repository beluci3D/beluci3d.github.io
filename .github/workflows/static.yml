name: Update & Deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install feed tools
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Fetch MakerWorld + YouTube
        run: node scripts/update-feeds.mjs
        continue-on-error: true

      - name: Save fresh data to repo
        run: |
          git config user.name  "beluci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          [ -d assets/mw ] && git add assets/mw || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-Update: MakerWorld & YouTube"
            git push || echo "Push übersprungen"
          fi

      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude '_site' --exclude 'README.md' ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
